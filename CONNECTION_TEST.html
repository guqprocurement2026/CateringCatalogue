<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Catalogue Connection Test</title><style>body{font-family:system-ui;margin:0;background:#f5f2eb;color:#162230}.box{max-width:720px;margin:70px auto;background:#fff;padding:30px;border-radius:18px;box-shadow:0 12px 40px #061b3318}.ok{color:#26705a}.bad{color:#8e2446}code{background:#f3f4f6;padding:2px 5px;border-radius:5px}</style></head><body><div class="box"><h1>GU-Q Catalogue Connection Test</h1><div id="result">Testing <code>catalogue.json</code>…</div></div><script>fetch('catalogue.json?v='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(d=>{if(!d.hotels||!d.hotels.length)throw new Error('No hotels found');document.getElementById('result').innerHTML='<h2 class="ok">✓ CONNECTION WORKING</h2><p>The website can read <code>catalogue.json</code>.</p><p><b>'+d.hotels.length+'</b> venues and <b>'+d.hotels.reduce((n,h)=>n+(h.categories||[]).length,0)+'</b> menu categories are available.</p>'}).catch(e=>document.getElementById('result').innerHTML='<h2 class="bad">✕ CONNECTION FAILED</h2><p>'+e.message+'</p><p>Make sure <code>index.html</code>, <code>app.js</code>, <code>styles.css</code> and <code>catalogue.json</code> are all in the same GitHub repository root.</p>')</script></body></html>
